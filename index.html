
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARDENSTICK | Floricultura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GARDENSTICK</h1>
        <p>Flores e carinho em cada detalhe.</p>
    </header>

    <main>
        <section class="catalogo">
            <h2>Nossos Produtos</h2>

            <select id="filtroCategoria">
    <option value="">Todas as categorias</option>
    <option value="Flores">Flores</option>
    <option value="Plantas">Plantas</option>
    <option value="Arranjos">Arranjos</option>
</select>
            <input
                type="text"
                id="campoPesquisa"
                placeholder="Pesquise uma flor ou planta..."
            >

            <div id="listaProdutos" class="lista-produtos">
                <!-- Os produtos serão exibidos aqui pelo JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>GARDENSTICK - Sua floricultura virtual</p>
    </footer>

    <script src="script.js?v=20261112"></script>
</body>
</html>
