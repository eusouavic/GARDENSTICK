<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARDENSTICK | Floricultura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GARDENSTICK</h1>
        <p>Flores e carinho em cada detalhe.</p>
    </header>

    <main>
        <section class="catalogo">
            <h2>Nossos Produtos</h2>

            <select id="filtroCategoria">
                <option value="">Todas as categorias</option>
                <option value="Flores">Flores</option>
                <option value="Plantas">Plantas</option>
                <option value="Arranjos">Arranjos</option>
            </select>

            <input
                type="text"
                id="campoPesquisa"
                placeholder="Pesquise uma flor ou planta..."
            >

            <div id="listaProdutos" class="lista-produtos">
                <article class="produto">
                    <h3>Buquê de Rosas</h3>
                    <p>Flores</p>
                    <p>R$ 89,90</p>
                </article>
                <article class="produto">
                    <h3>Girassol</h3>
                    <p>Flores</p>
                    <p>R$ 25,00</p>
                </article>
                <article class="produto">
                    <h3>Orquídea</h3>
                    <p>Plantas</p>
                    <p>R$ 75,00</p>
                </article>
                <article class="produto">
                    <h3>Lírio Branco</h3>
                    <p>Flores</p>
                    <p>R$ 45,00</p>
                </article>
                <article class="produto">
                    <h3>Suculenta</h3>
                    <p>Plantas</p>
                    <p>R$ 18,00</p>
                </article>
                <article class="produto">
                    <h3>Arranjo Primavera</h3>
                    <p>Arranjos</p>
                    <p>R$ 110,00</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>GARDENSTICK - Sua floricultura virtual</p>
    </footer>

    <script src="script.js?v=20261112"></script>
</body>
</html>
